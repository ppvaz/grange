<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grange — Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='none' stroke='%234ade80' stroke-width='2' stroke-linecap='round'><line x1='16' y1='28' x2='16' y2='12'/><line x1='16' y1='12' x2='10' y2='6'/><line x1='16' y1='12' x2='22' y2='6'/><line x1='16' y1='16' x2='9' y2='11'/><line x1='16' y1='16' x2='23' y2='11'/><line x1='16' y1='20' x2='11' y2='16'/><line x1='16' y1='20' x2='21' y2='16'/></g></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="overview.css">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <span class="logo">🌾 GRANGE</span>
      <span class="work-dir" id="scanDir"></span>
    </div>
    <div class="header-right">
      <span class="project-count" id="projectCount"></span>
      <span class="status-dot" id="statusDot"></span>
      <span class="status-label" id="statusLabel">Connecting</span>
    </div>
  </header>

  <main class="overview-main">
    <section class="stats-bar" id="statsBar"></section>

    <section class="attention-section" id="attentionSection" style="display:none">
      <h2>Attention Needed</h2>
      <div class="attention-list" id="attentionList"></div>
    </section>

    <section class="projects-grid" id="projectsGrid"></section>
  </main>

  <script src="overview.js"></script>
</body>
</html>
